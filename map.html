<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Sutherland European Adventure Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: header on top; map with chapter chips on the left, selected-stop card and stop list on the right (stacked on phones). */
:root {
  --bg: #e6edf0;
  --surface: #fbfcfc;
  --surface2: #edf3f5;
  --ink: #13232d;
  --muted: #566873;
  --line: #cbd7dc;
  --sea: #c3dbe8;
  --land: #f2f4ef;
  --border: #adbcc2;
  --sea-label: #4a7a95;
  --country: #7a8b95;
  --river: #0a7a68;
  --ocean: #1d3f86;
  --flight: #5a6c78;
  --coach: #7b4f94;
  --train: #8c5b0c;
  --now: #d63a2c;
  --on-now: #ffffff;
  --on-dot: #fbfcfc;
  --halo: rgba(242, 244, 239, 0.9);
  --casing: rgba(255, 255, 255, 0.9);
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09151e;
    --surface: #11212c;
    --surface2: #18303d;
    --ink: #e3edf2;
    --muted: #93a8b5;
    --line: #243947;
    --sea: #0b2234;
    --land: #1a2f3b;
    --border: #30495a;
    --sea-label: #6c96af;
    --country: #7592a3;
    --river: #3fd0b4;
    --ocean: #84acff;
    --flight: #93a8b5;
    --coach: #c9a3df;
    --train: #e3b45e;
    --now: #ff6e5e;
    --on-now: #09151e;
    --on-dot: #09151e;
    --halo: rgba(13, 29, 40, 0.88);
    --casing: rgba(6, 17, 25, 0.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09151e;
  --surface: #11212c;
  --surface2: #18303d;
  --ink: #e3edf2;
  --muted: #93a8b5;
  --line: #243947;
  --sea: #0b2234;
  --land: #1a2f3b;
  --border: #30495a;
  --sea-label: #6c96af;
  --country: #7592a3;
  --river: #3fd0b4;
  --ocean: #84acff;
  --flight: #93a8b5;
    --coach: #c9a3df;
  --train: #e3b45e;
  --now: #ff6e5e;
  --on-now: #09151e;
  --on-dot: #09151e;
  --halo: rgba(13, 29, 40, 0.88);
  --casing: rgba(6, 17, 25, 0.75);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }

/* Header */
.kicker { margin: 0 0 6px; font: 500 0.72rem/1.2 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 400 clamp(2.1rem, 7vw, 3.4rem)/1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.status { margin: 10px 0 0; color: var(--muted); max-width: 62ch; }
.status strong { color: var(--ink); font-weight: 600; }

/* Chapter chips */
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 10px; padding: 0; list-style: none; }
.chips li:first-child { grid-column: 1 / -1; }
.chip { width: 100%; min-height: 48px; text-align: left; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; gap: 1px; }
.chip b { font-weight: 600; font-size: 0.9rem; line-height: 1.2; }
.chip span { font: 400 0.7rem/1.2 var(--font-mono); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] span { color: inherit; opacity: 0.78; }
.chip:focus-visible, .zoom button:focus-visible, .row:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }

/* Map */
.mapwrap { position: relative; aspect-ratio: 1 / 1.04; max-height: 82vh; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sea); }
#map { display: block; width: 100%; height: 100%; background: var(--sea); user-select: none; -webkit-user-select: none; }
#map.grab { cursor: grab; }
#map.dragging { cursor: grabbing; }
.land { fill: var(--land); stroke: var(--border); stroke-width: 0.8px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.sealab { font: italic 400 14px var(--font-display); fill: var(--sea-label); letter-spacing: 0.04em; pointer-events: none; text-anchor: middle; }
.colab { font: 500 9.5px var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; fill: var(--country); pointer-events: none; text-anchor: middle; }
.leg { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.leg.case { stroke: var(--casing); stroke-width: 6.5px; }
.leg.river { stroke: var(--river); stroke-width: 3.2px; }
.leg.sea { stroke: var(--ocean); stroke-width: 3.2px; }
.leg.flight { stroke: var(--flight); stroke-width: 2px; stroke-dasharray: 7 6; stroke-linecap: butt; }
.leg.train { stroke: var(--train); stroke-width: 2.8px; stroke-dasharray: 0.1 6; }
.leg.coach { stroke: var(--coach); stroke-width: 2.6px; stroke-dasharray: 9 4 2 4; stroke-linecap: butt; }
.leg.off { opacity: 0.38; }
.leg.case.off { opacity: 0.2; }
.stop { cursor: pointer; outline: none; }
.stop .hit { fill: transparent; }
.stop .dot { stroke-width: 2px; }
.stop.done .dot { fill: var(--ink); stroke: var(--surface); }
.stop.next .dot { fill: var(--surface); stroke: var(--ink); }
.stop.now .dot { fill: var(--now); stroke: var(--surface); }
.stop .num { font: 700 9.5px var(--font-body); text-anchor: middle; pointer-events: none; }
.stop.done .num { fill: var(--on-dot); }
.stop.next .num { fill: var(--ink); }
.stop.now .num { fill: var(--on-now); }
.stop .ring { fill: none; stroke: var(--now); stroke-width: 2px; transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
.stop .sel { fill: none; stroke: var(--ink); stroke-width: 2px; display: none; }
.stop.on .sel, .stop:focus-visible .sel { display: block; }
.stop .lab { font: 600 11.5px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
@keyframes ping { from { transform: scale(1); opacity: 0.8; } to { transform: scale(2.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .stop .ring { animation: none; opacity: 0.5; } }

.zoom { position: absolute; top: 10px; right: 10px; display: grid; gap: 6px; }
.zoom button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: 500 1.25rem/1 var(--font-body); cursor: pointer; display: grid; place-items: center; }
.zoom button:active { background: var(--surface2); }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 0.78rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend svg { flex: none; overflow: visible; }

/* Selected stop card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; }
.card .top { display: flex; align-items: center; gap: 10px; }
.card h2 { margin: 0; font: 400 1.7rem/1.05 var(--font-display); text-wrap: balance; min-width: 0; }
.card .meta { margin: 0; font: 400 0.78rem/1.3 var(--font-mono); color: var(--muted); letter-spacing: 0.02em; }
.card .note { margin: 0; max-width: 56ch; }
.pill { justify-self: start; font: 500 0.68rem/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.now { background: var(--now); border-color: var(--now); color: var(--on-now); }

.badge { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 0.72rem/1 var(--font-body); border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
.badge.done { background: var(--ink); color: var(--on-dot); }
.badge.next { background: var(--surface); color: var(--ink); }
.badge.now { background: var(--now); border-color: var(--now); color: var(--on-now); }

/* Stop list */
.chapter { margin: 0 0 6px; }
.chapter h3 { margin: 16px 0 4px; padding: 0 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; align-items: baseline; font: 500 0.72rem/1.3 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.chapter ol { margin: 0; padding: 0; list-style: none; }
.row { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 46px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.row:hover { background: var(--surface2); }
.row[aria-current="true"] { background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line); }
.row .nm { display: block; font-weight: 600; font-size: 0.95rem; line-height: 1.25; }
.row .co { display: block; font-size: 0.78rem; color: var(--muted); }
.row .dt { font: 400 0.74rem/1.2 var(--font-mono); color: var(--muted); text-align: right; white-space: nowrap; }

.foot { margin: 8px 0 0; color: var(--muted); font-size: 0.8rem; max-width: 70ch; }

@media (min-width: 900px) {
  .page { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); column-gap: 28px; align-items: start; }
  header, .foot { grid-column: 1 / -1; }
  .left { position: sticky; top: 16px; }
  .mapwrap { aspect-ratio: 1.1 / 1; max-height: 78vh; }
}
</style>

</head>
<body>
<div class="page">
  <header>
    <p class="kicker">14 September – 24 October 2026</p>
    <h1>Sutherland European Adventure</h1>
    <p class="status" id="status"></p>
  </header>

  <div class="left">
    <ul class="chips" id="chips" aria-label="Map view"></ul>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="group" aria-label="Map of every stop on the trip" xmlns="http://www.w3.org/2000/svg">
        <g id="g-land"></g>
        <g id="g-sea"></g>
        <g id="g-country"></g>
        <g id="g-legs"></g>
        <g id="g-stops"></g>
      </svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
      </div>
    </div>
    <ul class="legend" id="legend"></ul>
  </div>

  <div class="right">
    <section class="card" id="card" aria-live="polite"></section>
    <div id="list"></div>
  </div>

  <p class="foot">Off the map: Launceston, Melbourne and Kuala Lumpur at the start, and the flight home from Istanbul on 23 October, back to Melbourne via Kuala Lumpur.</p>
</div>

L591.2,653.3L592.4,647.7L594.6,641.4L594.1,634L594.6,628.3L593.4,624.7L592.8,620.2L594.3,614.2L595.8,612.6L596.6,610.7L596.4,604.3L592.7,601.6Z","stops":[{"id":"paris","name":"Paris","short":"Paris","country":"France","start":"2026-09-16","end":"2026-09-20","lab":1,"dir":"w","note":"Most of the plan went ahead, but the Opéra Garnier was closed. Notre-Dame’s interior was a pleasant surprise, the Panthéon crypt was a highlight, and the Napoleon displays at Les Invalides were a favourite.","x":90,"y":275.4},{"id":"amsterdam","name":"Amsterdam","short":"Amsterdam","country":"Netherlands","start":"2026-09-20","end":"2026-09-20","lab":1,"dir":"e","note":"Eurostar from Paris, topping out at 300 km/h. Arrived mid-afternoon to a last-minute ship swap onto Viking Egdir, then an evening walk through the old town, red light district included.","x":180.7,"y":134},{"id":"kinderdijk","name":"Kinderdijk","short":"Kinderdijk","country":"Netherlands","start":"2026-09-21","end":"2026-09-21","lab":3,"dir":"w","note":"Sailed overnight to see the windmills, then a beautiful day on the sundeck cruising Dutch waterways.","x":171,"y":154.1},{"id":"cologne","name":"Cologne","short":"Cologne","country":"Germany","start":"2026-09-22","end":"2026-09-22","lab":2,"dir":"w","note":"Gary stayed on board for Cologne and Koblenz while Leonie went ashore with Sally and Phil, the Kiwi friends they made on the cruise.","x":229.1,"y":202},{"id":"koblenz","name":"Koblenz","short":"Koblenz","country":"Germany","start":"2026-09-23","end":"2026-09-23","lab":3,"dir":"w","note":"Where the Rhine meets the Moselle, reached after the small-boat cruise through the Rhine Gorge.","x":244,"y":228.8},{"id":"bingen","name":"Bingen (Rhine Gorge)","short":"Bingen","country":"Germany","start":"2026-09-23","end":"2026-09-23","lab":3,"dir":"w","note":"Low water kept the ship off this stretch. Passengers went by coach to Bingen, then took a smaller boat on a two-hour castle and vineyard cruise.","x":251,"y":246.4},{"id":"miltenberg","name":"Miltenberg","short":"Miltenberg","country":"Germany","start":"2026-09-24","end":"2026-09-24","lab":3,"dir":"w","note":"Walking tour of the half-timbered town, with an inn that has taken guests since 1411, and a glassblowing demo in the afternoon. Lots of locks on the Main. Trivia team Adventure Before Dementia had the best name but no chocolates.","x":288.2,"y":260.9},{"id":"wurzburg","name":"Würzburg","short":"Würzburg","country":"Germany","start":"2026-09-25","end":"2026-09-25","lab":3,"dir":"n","note":"The Residenz, with the Mirror Cabinet the spectacular highlight, plus the old stone bridge lined with statues and the fortress above the town. Skipped the optional excursions.","x":307.8,"y":258.2},{"id":"bamberg","name":"Bamberg","short":"Bamberg","country":"Germany","start":"2026-09-26","end":"2026-09-26","lab":3,"dir":"n","note":"Walking tour: the Old Town Hall sitting on a bridge in the river, views up to St Michael’s Abbey, and smoky rauchbier from Schlenkerla.","x":334.5,"y":255.1},{"id":"nuremberg","name":"Nuremberg","short":"Nuremberg","country":"Germany","start":"2026-09-27","end":"2026-09-27","lab":2,"dir":"s","note":"WWII tour: Zeppelin Field, then the Documentation Centre at the Congress Hall, then Courtroom 600. Lunch in the old town and a look around the market square. In the afternoon, coach to Passau to join Viking Tir.","x":338.5,"y":274.6},{"id":"regensburg","name":"Regensburg","short":"Regensburg","country":"Germany","start":"2026-09-28","end":"2026-09-28","lab":3,"dir":"s","note":"A surprise. We found the Wurstkuchl, the oldest takeaway shop in the world, which has surely sold more snags than Bunnings.","x":366.7,"y":294.8},{"id":"passau","name":"Passau","short":"Passau","country":"Germany","start":"2026-09-29","end":"2026-09-29","lab":2,"dir":"s","note":"City of Three Rivers, with a little Italian-feeling quarter full of cafés and shops. Sailed for Austria that night.","x":404.1,"y":315.2},{"id":"melk","name":"Melk & Ybbs","short":"Melk","country":"Austria","start":"2026-09-30","end":"2026-09-30","lab":3,"dir":"s","note":"Ybbs was as far as the ship could sail, and it stayed anchored there for three days. Coach to Melk Abbey: great views over the Danube, no photos inside the rooms, and a church covered in gold. Afternoon walk around Ybbs and a beer garden.","x":458.6,"y":330.3},{"id":"vienna","name":"Vienna","short":"Vienna","country":"Austria","start":"2026-10-01","end":"2026-10-02","lab":1,"dir":"n","note":"Two coach days from Ybbs. Day one: the Hofburg area, the Lipizzaner horses, St Stephen’s Cathedral and a shared giant schnitzel at Figlmüller. Day two: the Kunsthistorisches Museum for Rubens and Greek, Roman and Egyptian antiquities, lunch in the museum café, and one wrong tram on the way back. Our team won music trivia with a perfect score.","x":488.6,"y":330.8},{"id":"budapest","name":"Budapest","short":"Budapest","country":"Hungary","start":"2026-10-03","end":"2026-10-06","lab":1,"dir":"e","note":"Low water ended the cruise at Ybbs, so a five-hour coach ride to Budapest. Central Market, a panoramic tour, and a farewell dinner at Aranybástya with Sally and Phil. Then 7Seasons Apartments: ruin bar lunch, Parliament, Shoes on the Danube, the Palace of Justice, and St Stephen’s Basilica, possibly the most impressive cathedral of the trip. Flew out on 6 Oct.","x":567,"y":359},{"id":"chioggia","name":"Chioggia","short":"Chioggia","country":"Italy","start":"2026-10-06","end":"2026-10-07","lab":2,"dir":"e","note":"Flew from Budapest to Venice, then a transfer to Chioggia for the night at Hotel Grande Italia. Boarded Viking Sky on 7 Oct.","x":366.3,"y":459},{"id":"venice","name":"Venice","short":"Venice","country":"Italy","start":"2026-10-08","end":"2026-10-08","lab":1,"dir":"w","note":"Venice in three hours. A 90-minute ferry from Chioggia across the lagoon, past little island communities. St Mark’s Square and the Basilica, the Campanile, the Doge’s Palace and Bridge of Sighs, and the Grand Canal at the Rialto Bridge. We also found San Zaccaria and San Moisè, saw Santa Maria della Salute across the water, and squeezed in some shopping while dodging tourists and influencers.","x":367.7,"y":449.4},{"id":"zadar","name":"Zadar","short":"Zadar","country":"Croatia","start":"2026-10-09","end":"2026-10-09","lab":2,"dir":"w","note":"The Roman Forum and the Sea Organ, with a video that has the sound of the waves playing the organ.","x":456.2,"y":507.8},{"id":"dubrovnik","name":"Dubrovnik","short":"Dubrovnik","country":"Croatia","start":"2026-10-10","end":"2026-10-10","lab":1,"dir":"w","note":"No dragons, but a horde of angry tourists and their umbrellas. The rain finally arrived, so the wet steps were too slippery to climb the walls and we watched others take a tumble. A quick visit to the Franciscan monastery and museum, then the narrow alleys and steps past expensive bars, restaurants and plenty of Game of Thrones shops. We left early because of the weather and the umbrellas.","x":547.2,"y":569.3},{"id":"kotor","name":"Kotor","short":"Kotor","country":"Montenegro","start":"2026-10-11","end":"2026-10-11","lab":2,"dir":"e","note":"Explored the Old Town, then took the cable car up the mountain. Overcast, with cloud hiding the bay, so we had a meal and drinks at the café-restaurant at the top.","x":569.2,"y":578.2},{"id":"corfu","name":"Corfu","short":"Corfu","country":"Greece","start":"2026-10-12","end":"2026-10-12","lab":1,"dir":"w","note":"Sunny. Wandered the old town and shops, then lunch of gyros and souvlaki. We saw the Old and New Fortress from a distance.","x":613,"y":697.1},{"id":"olympia","name":"Olympia (Katakolon)","short":"Olympia","country":"Greece","start":"2026-10-13","end":"2026-10-13","lab":2,"dir":"w","note":"Half a day in the rain: the ancient ruins and the museum.","x":666.2,"y":779.4},{"id":"athens","name":"Athens (Piraeus)","short":"Athens","country":"Greece","start":"2026-10-14","end":"2026-10-15","lab":1,"dir":"e","note":"Two days at Piraeus. Day one was rainy, so the National Archaeological Museum. Day two was clearer for the Acropolis despite the crowds, then a quick Greek lunch in Plaka.","x":744.5,"y":759.4},{"id":"heraklion","name":"Heraklion","short":"Heraklion","country":"Greece","start":"2026-10-16","end":"2026-10-16","lab":1,"dir":"s","note":"The Archaeological Museum and a walk through the town. Knossos and the Venetian fortress are left for next time.","x":809.3,"y":866},{"id":"rhodes","name":"Rhodes","short":"Rhodes","country":"Greece","start":"2026-10-17","end":"2026-10-17","lab":1,"dir":"s","note":"Heavy rain in the morning cleared for an afternoon tour of the Old Town: the main square, the old Jewish Quarter, the Knights Hospitaller sites and the Palace of the Grand Master.","x":910,"y":803.3},{"id":"ephesus","name":"Ephesus (Kuşadası)","short":"Ephesus","country":"Türkiye","start":"2026-10-18","end":"2026-10-18","lab":2,"dir":"e","note":"Perfect weather. The ruins of Ephesus: Curetes Street, the Library of Celsus, the Great Theatre and the terraced houses with mosaics. Easier to walk than the Acropolis. Haggled in Kuşadası and probably overpaid.","x":867.7,"y":747.3},{"id":"gallipoli","name":"Gallipoli (Çanakkale)","short":"Gallipoli","country":"Türkiye","start":"2026-10-19","end":"2026-10-19","lab":2,"dir":"e","note":"A day trip to Gallipoli instead of Troy: the war museum, Anzac Cove, Lone Pine cemetery and Chunuk Bair.","x":825.2,"y":652.9},{"id":"istanbul","name":"Istanbul","short":"Istanbul","country":"Türkiye","start":"2026-10-20","end":"2026-10-22","lab":1,"dir":"n","note":"Viking Sky arrived on 20 Oct, with Galata Tower and rooftop drinks, then Hotel De Reve Galata. A day around Sultanahmet, and a ferry across to the Asian side (Üsküdar and Kadıköy). Flight home at 1:30 am on 23 Oct.","x":902.8,"y":603.5}],"legs":[{"t":"train","to":1,"pts":[[90,275.4],[180.7,134]]},{"t":"river","to":2,"pts":[[180.7,134],[171,154.1]]},{"t":"river","to":3,"pts":[[171,154.1],[229.1,202]]},{"t   svg.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    if (anim) cancelAnimationFrame(anim);
    drag = { x: e.clientX, y: e.clientY, cx: V.cx, cy: V.cy }; moved = false;
    svg.setPointerCapture(e.pointerId); svg.classList.add('dragging');
  });
  svg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var u = V.w / Wpx, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    V.cx = Math.max(-200, Math.min(1200, drag.cx - dx * u));
    V.cy = Math.max(-200, Math.min(1200, drag.cy - dy * u));
    setChip(null); render();
  });
  function endDrag() { drag = null; svg.classList.remove('dragging'); setTimeout(function () { moved = false; }, 0); }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  /* ---------- legend ---------- */
  (function () {
    function line(cls, dash) {
      var st = { river: 'var(--river)', sea: 'var(--ocean)', flight: 'var(--flight)', train: 'var(--train)', coach: 'var(--coach)' }[cls];
      var extra = cls === 'flight' ? ' stroke-dasharray="6 5"' : (cls === 'train' ? ' stroke-dasharray="0.1 6" stroke-linecap="round"' : (cls === 'coach' ? ' stroke-dasharray="8 3 2 3"' : ''));
      var sw = cls === 'train' ? 3 : (cls === 'flight' ? 2 : 3.2);
      return '<svg width="26" height="8" viewBox="0 0 26 8" aria-hidden="true"><path d="M1 4H25" fill="none" stroke="' + st + '" stroke-width="' + sw + '"' + extra + '/></svg>';
    }
    function dot(cls) {
      var f = { done: 'var(--ink)', now: 'var(--now)', next: 'var(--surface)' }[cls];
      var s = cls === 'next' ? 'var(--ink)' : 'var(--surface)';
      return '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="' + f + '" stroke="' + s + '" stroke-width="2"' + (cls === 'next' ? '' : '') + '/><circle cx="7" cy="7" r="6" fill="none" stroke="var(--line)" stroke-width="1" opacity="' + (cls === 'next' ? 0 : 1) + '"/></svg>';
    }
    var items = [
      [line('river'), 'Grand European Tour, river ship'], [line('coach'), 'Coach'], [line('sea'), 'Ancient Adriatic Treasures, Viking Sky'], [line('train'), 'Train'], [line('flight'), 'Flight'],
      [dot('done'), 'Visited'], [dot('now'), 'Here now'], [dot('next'), 'Coming up']
    ];
    $('legend').innerHTML = items.map(function (it) { return '<li>' + it[0] + '<span>' + it[1] + '</span></li>'; }).join('');
  })();

  /* ---------- boot ---------- */
  measure();
  setChip('all');
  go(fitFor(CH[0]), true);
  var cur = stops.filter(function (s) { return s.st === 'now'; }).pop();
  select(cur ? cur.i : 0, false);

  var rto;
  function onResize() {
    var before = allW;
    measure();
    var ch = CH.filter(function (c) { return c.id === activeChip; })[0];
    if (ch) go(fitFor(ch), true);
    else { V.w = V.w * (allW / before); render(); }
  }
  if (window.ResizeObserver) new ResizeObserver(function () { clearTimeout(rto); rto = setTimeout(onResize, 60); }).observe(wrap);
  else window.addEventListener('resize', onResize);
})();
</script>

</body>
</html>
